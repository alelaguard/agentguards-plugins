name: HOL Plugin Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Was pinned to "codex" alone, so eight of the nine plugins shipped unscanned —
    # including both Claude plugins, which have by far the most installs.
    #
    # Several sit below the 80 threshold codex meets, and for most of them that is
    # structural rather than fixable: claude-selfhosted caps at 78 because it has no
    # MCP server to score (the whole point of the variant), and copilot/opencode score
    # 0/25 on Manifest Validation because this scanner looks for .codex-plugin/ and
    # they keep valid manifests elsewhere. Raising those would mean breaking working
    # plugins to satisfy a rubric that does not cover them.
    # Those are packaging/completeness gaps (codex has the LICENSE, SECURITY.md,
    # assets and full interface metadata the others lack), not newly-introduced
    # vulnerabilities — none of them regressed here, they were simply never measured.
    #
    # So: `blocking` plugins gate the build as before, the rest report only. Their
    # SARIF still uploads, so findings appear in the Security tab and someone can
    # raise them deliberately. Gating them today would block security fixes behind a
    # metadata cleanup, and lowering the threshold to make everything pass would
    # quietly weaken the one plugin that already meets it.
    #
    # Flip `blocking: true` per plugin as each is brought up to standard.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin_dir: codex, blocking: true }
          - { plugin_dir: gemini, blocking: true }
          - { plugin_dir: gemini-selfhosted, blocking: true }
          - { plugin_dir: codex-selfhosted, blocking: true }
          - { plugin_dir: claude, blocking: true }
          - { plugin_dir: claude-selfhosted, blocking: false }
          - { plugin_dir: copilot, blocking: false }
          - { plugin_dir: copilot-selfhosted, blocking: false }
          - { plugin_dir: opencode, blocking: false }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@260cc0d630501bd6507461c0f50dce5a13bd506d # v1.2.367
        continue-on-error: ${{ !matrix.blocking }}
        with:
          plugin_dir: ${{ matrix.plugin_dir }}
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
