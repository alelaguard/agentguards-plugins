name: HOL Plugin Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Was pinned to "codex" alone, so eight of the nine plugins shipped unscanned —
    # including both Claude plugins, which have by far the most installs.
    strategy:
      fail-fast: false
      matrix:
        plugin_dir:
          - claude
          - claude-selfhosted
          - codex
          - codex-selfhosted
          - copilot
          - copilot-selfhosted
          - gemini
          - gemini-selfhosted
          - opencode
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@260cc0d630501bd6507461c0f50dce5a13bd506d # v1.2.367
        with:
          plugin_dir: ${{ matrix.plugin_dir }}
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
