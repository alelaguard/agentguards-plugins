name: CLI tests

# The installer runs on all three desktop OSes, and file permissions, paths and
# home-directory lookup differ on each — so test on each.
on:
  # The parity steps compare the PowerShell hooks (Windows) with the Python ones
  # (Linux/macOS), so a change to EITHER side must run them — not just cli/.
  pull_request:
    paths: ["cli/**", "codex/**", "claude/**", "tests/test_*ps1*.py", "tests/installer_e2e/**", ".github/workflows/cli-*.yml"]
  push:
    branches: [main]
    paths: ["cli/**", "codex/**", "claude/**", "tests/test_*ps1*.py", "tests/installer_e2e/**", ".github/workflows/cli-*.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
      - name: Vet and test
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: install.sh is valid POSIX sh
        if: runner.os != 'Windows'
        run: sh -n cli/install.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PowerShell hooks behave exactly like the Python hooks (parity, pwsh 7)
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_ps1_shared_core.py tests/test_codex_ps1_parity.py tests/test_claude_ps1_parity.py -q
      # Windows PowerShell 5.1 is what the agents actually launch on a stock Windows box.
      - name: PowerShell hooks parity under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: bash
        env:
          PS_EXE: powershell
        run: python -m pytest tests/test_codex_ps1_parity.py tests/test_claude_ps1_parity.py -q
      - name: Codex Windows hook, run the way Codex runs it (cmd.exe /C commandWindows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = (Resolve-Path codex).Path
          $hooks = Get-Content -Raw codex/hooks/hooks.json | ConvertFrom-Json
          $cmdLine = $hooks.hooks.UserPromptSubmit[0].hooks[0].commandWindows.Replace('${PLUGIN_ROOT}', $root)
          Remove-Item Env:AGENTGUARDS_API_KEY -ErrorAction SilentlyContinue
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'nokey-home'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          # Exactly Codex's spawn (codex-rs command_runner): %COMSPEC% /C "<command>", raw.
          $psi = [System.Diagnostics.ProcessStartInfo]::new($env:ComSpec, '/C "' + $cmdLine + '"')
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          # No key anywhere: the hook's own fail-closed "not configured" block, as JSON.
          $p.StandardInput.Write('{"prompt":"hi"}'); $p.StandardInput.Close()
          $out = $p.StandardOutput.ReadToEnd(); $p.WaitForExit()
          Write-Host "hook said: $out"
          $v = $out | ConvertFrom-Json
          if ($v.decision -ne 'block' -or $v.reason -notmatch 'not configured') { throw 'commandWindows did not run the PowerShell hook' }

  # The bootstrap scripts end to end on each OS, against a locally built binary
  # served over HTTP: download, checksum check, install location, hand-off to the
  # binary. `--agents nope` stops before any agent is touched, and a tampered
  # binary must be refused.
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
      - name: Build and serve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p serve
          os=$(go env GOOS); arch=$(go env GOARCH)
          name="agentguards_${os}_${arch}"; [ "$os" = windows ] && name="$name.exe"
          (cd cli && CGO_ENABLED=0 go build -ldflags "-X main.version=0.0.0-ci" -o "../serve/$name" .)
          (cd serve && python3 -c "import hashlib,os;[print(hashlib.sha256(open(f,'rb').read()).hexdigest()+'  '+f) for f in os.listdir('.') if f.startswith('agentguards_')]" > SHA256SUMS)
          cat serve/SHA256SUMS
          (cd serve && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
      - name: install.sh installs and hands off
        if: runner.os != 'Windows'
        run: |
          set -u
          out=$(AGENTGUARDS_DOWNLOAD_BASE=http://127.0.0.1:8765 sh cli/install.sh --agents nope </dev/null 2>&1 || true)
          echo "$out"
          test -x "$HOME/.agentguards/bin/agentguards"
          "$HOME/.agentguards/bin/agentguards" version | grep -q 0.0.0-ci
          echo "$out" | grep -q 'unknown agent "nope"'
      - name: install.sh refuses a tampered binary
        if: runner.os != 'Windows'
        run: |
          f=$(ls serve/agentguards_*); echo junk >> "$f"
          if AGENTGUARDS_DOWNLOAD_BASE=http://127.0.0.1:8765 sh cli/install.sh </dev/null; then
            echo "tampered binary was accepted"; exit 1
          fi
      - name: Seed a %VAR% entry in the user PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $raw = [string]$k.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $k.SetValue('Path', "$raw;%USERPROFILE%\agentguards-ci-marker", [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $k.Close()
      - name: install.ps1 installs and hands off
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AGENTGUARDS_DOWNLOAD_BASE = 'http://127.0.0.1:8765'
          $env:AGENTGUARDS_INSTALL_ARGS = '--agents nope'
          & ([scriptblock]::Create((Get-Content -Raw cli/install.ps1))) *>&1 | Tee-Object -Variable log | Out-Host
          $exe = Join-Path $HOME '.agentguards\bin\agentguards.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if (-not ((& $exe version) -match '0.0.0-ci')) { throw 'wrong binary' }
          if (-not (($log | Out-String) -match 'unknown agent')) { throw 'did not hand off to the binary' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (($userPath -split ';') -contains (Split-Path $exe))) { throw 'bin dir not added to user PATH' }
          $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = [string]$k.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if ($raw -notlike '*%USERPROFILE%\agentguards-ci-marker*') { throw "a %VAR% PATH entry was expanded/flattened: $raw" }
          if ($k.GetValueKind('Path') -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw 'PATH lost its REG_EXPAND_SZ type' }
      - name: install.ps1 refuses a tampered binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = Get-ChildItem serve/agentguards_* | Select-Object -First 1
          Add-Content -Path $f.FullName -Value 'junk'
          $env:AGENTGUARDS_DOWNLOAD_BASE = 'http://127.0.0.1:8765'
          $failed = $false
          try { & ([scriptblock]::Create((Get-Content -Raw cli/install.ps1))) } catch { $failed = $true; Write-Host "refused: $_" }
          if (-not $failed) { throw 'tampered binary was accepted' }

  # The whole installer, end to end, on a real Mac (and Linux): the real
  # install.sh -> binary -> Claude Code + Codex plugins -> the INSTALLED hooks,
  # against a local mock API (no secrets). The mock records which client sent
  # each request, proving which runtime each hook used ("codex/py").
  installer-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      AGENTGUARDS_URL: http://127.0.0.1:8799
      AGENTGUARDS_DOWNLOAD_BASE: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the agents
        run: npm install -g --silent @anthropic-ai/claude-code @openai/codex
      - name: Build the CLI, serve it with SHA256SUMS, start the mock API
        run: |
          set -euo pipefail
          mkdir -p serve
          name="agentguards_$(go env GOOS)_$(go env GOARCH)"
          (cd cli && CGO_ENABLED=0 go build -ldflags "-X main.version=0.0.0-ci" -o "../serve/$name" .)
          (cd serve && python -c "import hashlib,os;[print(hashlib.sha256(open(f,'rb').read()).hexdigest()+'  '+f) for f in os.listdir('.') if f.startswith('agentguards_')]" > SHA256SUMS)
          (cd serve && python -m http.server 8765 >/dev/null 2>&1 &)
          (python tests/installer_e2e/mock_api.py 8799 >/dev/null 2>&1 &)
          sleep 2
      - name: install.sh (the real bootstrap) sets up Claude Code and Codex
        run: |
          set -euo pipefail
          KEY="ag_$(printf '7%.0s' $(seq 32))"   # fake; the mock accepts any ag_ key
          # Claude's plugin from this checkout, so plugin changes in the PR are tested.
          # (Codex always installs its plugin from GitHub main: git-subdir ref main.)
          AGENTGUARDS_PLUGIN_SOURCE="$GITHUB_WORKSPACE" sh cli/install.sh --yes --key "$KEY" </dev/null | tee install.log
          grep -q 'Setting up Claude Code... ✓' install.log
          grep -q 'Setting up Codex... ✓' install.log
          # Portable (GNU `stat -f` means file-system status, BSD's means format).
          test "$(python -c "import os;print(oct(os.stat(os.path.expanduser('~/.agentguards/credentials.json')).st_mode & 0o777))")" = 0o600
      - name: doctor
        run: ~/.agentguards/bin/agentguards doctor
      - name: Installed hooks screen with only the saved key
        run: python tests/installer_e2e/check_hooks.py "$AGENTGUARDS_URL"
      - name: Re-running install is safe, uninstall removes everything
        run: |
          set -euo pipefail
          KEY="ag_$(printf '7%.0s' $(seq 32))"
          ~/.agentguards/bin/agentguards install --yes --key "$KEY" </dev/null
          test "$(claude plugin list --json | python -c "import sys,json;print(sum(1 for p in json.load(sys.stdin) if p['id'].startswith('agentguards-claude')))")" = 1
          ~/.agentguards/bin/agentguards uninstall --yes </dev/null
          test ! -f "$HOME/.agentguards/credentials.json"
          if ~/.agentguards/bin/agentguards doctor | grep -q 'AgentGuards installed'; then echo "still installed after uninstall"; exit 1; fi
