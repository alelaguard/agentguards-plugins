name: Plugin integrity

# Three cheap checks that each exist because the corresponding mistake was made and
# shipped:
#
#   versions   claude-selfhosted sat at plugin.json 0.1.3 / package.json 0.1.0 for three
#              releases. Claude Code reads the first, npm publishes the second, so npm
#              users were pinned to code that no longer matched.
#   names      a hook was edited so that a constant it referenced was never defined. The
#              file compiled fine (py_compile is happy with a NameError) AND imported
#              fine, because the reference sat inside a function -- it would only have
#              blown up the first time a user triggered that code path. ruff's F821
#              finds it statically, which importing cannot.
#   manifests  `claude plugin validate` checks plugin.json, skill/agent frontmatter and
#              hooks.json against the real schema, which nothing else here does.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: plugin.json and package.json agree on the version
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for pkg in */package.json; do
            dir="$(dirname "$pkg")"
            manifest=""
            for candidate in "$dir/.claude-plugin/plugin.json" "$dir/.codex-plugin/plugin.json" \
                             "$dir/plugin.json" "$dir/gemini-extension.json"; do
              [ -f "$candidate" ] && manifest="$candidate" && break
            done
            [ -z "$manifest" ] && continue
            a="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$manifest")"
            b="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$pkg")"
            if [ "$a" != "$b" ]; then
              echo "::error file=$pkg::version drift in $dir — $manifest is $a but package.json is $b"
              fail=1
            else
              echo "  ok  $dir  $a"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: no undefined names in any hook
        shell: bash
        run: |
          set -uo pipefail
          pipx run ruff check --select F821 --no-cache */scripts/*.py
          # F821 only. This is a correctness gate, not a style gate — it must never
          # start failing over formatting, or it will be silenced and stop catching
          # the thing it is here for.

      - name: manifests validate
        shell: bash
        run: |
          set -uo pipefail
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || {
            echo "::warning::could not install claude CLI; skipping manifest validation"; exit 0; }
          fail=0
          for dir in claude claude-selfhosted; do
            if claude plugin validate "./$dir"; then echo "  ok  $dir"; else
              echo "::error::$dir failed plugin validate"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || exit 1
